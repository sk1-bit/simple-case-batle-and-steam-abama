  // ════════════ Routing ════════════
  P11.setSubTab = function(tab){
    P11.SUBTAB = tab;
    document.querySelectorAll('.p11-subtab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    if (tab === 'store') P11.renderStore();
    else if (tab === 'library') P11.renderLibrary();
    else if (tab === 'wishlist') P11.renderWishlist();
  };

  P11.setRegion = function(r){
    P11.REGION = r;
    P11.save();
    document.querySelectorAll('.p11-region-flag').forEach(f => f.classList.toggle('active', f.dataset.region === r));
    toast(`🌍 Регион: ${r.toUpperCase()}`, 'info');
    if (P11.SUBTAB === 'store') P11.renderStore();
    if (P11.SUBTAB === 'wishlist') P11.renderWishlist();
  };

  P11.setFilter = function(cat, el){
    P11.FILTER = cat;
    document.querySelectorAll('#sec-games .gf-btn').forEach(b => b.classList.toggle('sel', b === el));
    P11.renderStore();
  };

  // ════════════ Render helpers ════════════
  P11.metaCls = function(s){ if (s >= 75) return 'green'; if (s >= 50) return 'yellow'; return 'red'; };

  P11.gameCard = function(g){
    const price = g.prices[P11.REGION];
    const old = g.oldPrices[P11.REGION];
    const disc = Math.round((1 - price / old) * 100);
    const inWish = P11.wishlist.has(g.id);
    const isOwned = !!P11.owned[g.id];
    const reviews = g.reviews.toLocaleString('ru').replace(/,/g, ' ');
    return `
      <div class="p11-card" data-id="${g.id}">
        <div class="p11-cover" style="background:${g.bg}">
          ${P11.makeCover(g)}
          <button class="p11-wish-btn ${inWish ? 'in-list' : ''}" onclick="event.stopPropagation();P11.toggleWish('${g.id}')" title="Wishlist">${inWish ? '❤️' : '🤍'}</button>
          <div class="p11-meta-badge ${P11.metaCls(g.metacritic)}" title="Metacritic score">${g.metacritic}</div>
          ${disc > 0 ? `<div class="p11-disc-badge">−${disc}%</div>` : ''}
          <div class="p11-cover-title">${g.title}</div>
        </div>
        <div class="p11-info">
          <div class="p11-tags">${g.tags.map(t => `<span class="p11-tag">${t}</span>`).join('')}</div>
          <div class="p11-publisher">${g.publisher}</div>
          <div class="p11-genre-row">${g.genre}</div>
          <div class="p11-reviews">⭐ ${reviews} отзывов</div>
          <div class="p11-price-row">
            <div>
              ${disc > 0 ? `<div class="p11-old-price">${fmtC(old)}</div>` : ''}
              <div class="p11-price ${disc > 0 ? 'discounted' : ''}">${fmtC(price)}</div>
            </div>
          </div>
          <div class="p11-actions">
            <button class="p11-buy-btn ${isOwned ? 'owned' : ''}" onclick="P11.buy('${g.id}')">${isOwned ? '✓ В БИБЛИОТЕКЕ' : '🛒 КУПИТЬ КЛЮЧ'}</button>
            <button class="p11-trailer-btn" onclick="event.stopPropagation();P11.trailer('${g.id}')" title="Трейлер">▶</button>
            <button class="p11-gift-btn" onclick="event.stopPropagation();P11.giftOpen('${g.id}')" title="Подарить">🎁</button>
          </div>
        </div>
      </div>`;
  };

  P11.renderStore = function(){
    const grid = $('games-grid');
    if (!grid) return;
    const list = P11.FILTER === 'all' ? P11.GAMES : P11.GAMES.filter(g => g.cat === P11.FILTER);
    grid.innerHTML = list.map(g => P11.gameCard(g)).join('');
  };

  P11.renderLibrary = function(){
    const grid = $('games-grid');
    if (!grid) return;
    const owned = Object.entries(P11.owned);
    if (!owned.length){
      grid.innerHTML = `<div class="p11-empty"><div class="p11-empty-icon">📚</div><div class="p11-empty-text">Библиотека пуста</div><div class="p11-empty-hint">Купите игру в магазине, и она появится здесь — с трекером часов как в Steam</div></div>`;
      return;
    }
    grid.style.display = 'block';
    grid.innerHTML = owned.map(([id, data]) => {
      const g = P11.GAMES.find(g => g.id === id);
      if (!g) return '';
      const m = data.minutes || 0;
      const hrs = (m / 60).toFixed(1);
      const playing = !!data.playing;
      const lp = data.lastPlayed ? new Date(data.lastPlayed).toLocaleDateString('ru') : '—';
      return `<div class="p11-lib-card" data-id="${id}">
        <div class="p11-lib-cover" style="background:${g.bg}">${P11.makeCover(g)}</div>
        <div class="p11-lib-info">
          <div class="p11-lib-title">${g.title}</div>
          <div class="p11-lib-genre">${g.genre} · ${g.publisher}</div>
          <div class="p11-lib-hours ${playing ? 'playing' : ''}">⏱ ${hrs} ч · ${playing ? 'В ИГРЕ' : 'последний запуск: ' + lp}</div>
        </div>
        <div class="p11-lib-actions">
          <button class="p11-play-btn ${playing ? 'playing' : ''}" onclick="P11.play('${id}')">${playing ? '⏸ ОСТАНОВИТЬ' : '▶ ИГРАТЬ'}</button>
        </div>
      </div>`;
    }).join('');
  };

  P11.renderWishlist = function(){
    const grid = $('games-grid');
    if (!grid) return;
    grid.style.display = '';
    const list = [...P11.wishlist].map(id => P11.GAMES.find(g => g.id === id)).filter(Boolean);
    if (!list.length){
      grid.innerHTML = `<div class="p11-empty"><div class="p11-empty-icon">❤️</div><div class="p11-empty-text">Wishlist пуст</div><div class="p11-empty-hint">Жми на ❤️ на карточках в магазине — мы будем оповещать о падении цены</div></div>`;
      return;
    }
    grid.innerHTML = list.map(g => P11.gameCard(g)).join('');
  };

  // ════════════ Actions ════════════
  P11.buy = function(id){
    const g = P11.GAMES.find(g => g.id === id);
    if (!g) return;
    if (P11.owned[id]){ toast('Игра уже в вашей библиотеке', 'info'); P11.setSubTab('library'); return; }
    const price = g.prices[P11.REGION];
    if (P11.getBal() < price){ toast('Недостаточно средств! Пополни баланс.', 'error'); return; }
    if (typeof window.updBalance === 'function') window.updBalance(-price);
    P11.owned[id] = { minutes: 0, lastPlayed: Date.now(), ownedAt: Date.now() };
    P11.wishlist.delete(id);
    P11.save();
    toast(`✓ ${g.title} в вашей библиотеке!`, 'success');
    if (typeof window.openWithdrawGeneric === 'function') {
      try { window.openWithdrawGeneric('🎮', g.title + ' — STEAM KEY', 'ИГРА', '#1b9aff', price); } catch(e) {}
    }
    P11.renderStore();
  };

  P11.toggleWish = function(id){
    const g = P11.GAMES.find(g => g.id === id);
    if (!g) return;
    if (P11.wishlist.has(id)){ P11.wishlist.delete(id); toast('Удалено из Wishlist', 'info'); }
    else { P11.wishlist.add(id); toast(`❤️ ${g.title} в Wishlist — будем следить за ценой`, 'success'); }
    P11.save();
    if (P11.SUBTAB === 'store') P11.renderStore();
    if (P11.SUBTAB === 'wishlist') P11.renderWishlist();
  };

  // ─── Trailer ───
  P11.trailer = function(id){
    const g = P11.GAMES.find(g => g.id === id);
    if (!g) return;
    $('p11-tr-title').textContent = g.title + ' — Official Trailer';
    $('p11-tr-canvas').innerHTML = P11.makeCover(g);
    $('p11-tr-canvas').style.background = g.bg;
    $('p11-tr-canvas').classList.remove('zoom');
    P11._tr = { playing: false, t: 0, dur: 180 };
    $('p11-tr-time').textContent = '0:00 / 3:00';
    $('p11-tr-progress-bar').style.width = '0%';
    $('p11-tr-play').classList.remove('playing');
    $('p11-tr-overlay').classList.add('open');
  };
  P11.trailerToggle = function(){
    const s = P11._tr;
    if (!s) return;
    s.playing = !s.playing;
    $('p11-tr-play').classList.toggle('playing', s.playing);
    if (s.playing){
      $('p11-tr-canvas').classList.add('zoom');
      s.timer = setInterval(() => {
        s.t += 2; // 2x speedup for demo
        if (s.t >= s.dur){ s.t = s.dur; s.playing = false; clearInterval(s.timer); $('p11-tr-play').classList.remove('playing'); }
        const mm = (n) => { const a = Math.floor(n / 60), b = n % 60; return a + ':' + (b < 10 ? '0' : '') + b; };
        $('p11-tr-time').textContent = mm(s.t) + ' / 3:00';
        $('p11-tr-progress-bar').style.width = (s.t / s.dur * 100) + '%';
      }, 250);
    } else {
      if (s.timer) clearInterval(s.timer);
      $('p11-tr-canvas').classList.remove('zoom');
    }
  };
  P11.trailerClose = function(){
    if (P11._tr && P11._tr.timer) clearInterval(P11._tr.timer);
    $('p11-tr-overlay').classList.remove('open');
    $('p11-tr-canvas').classList.remove('zoom');
  };

  // ─── Gift ───
  P11.giftOpen = function(id){
    const g = P11.GAMES.find(g => g.id === id);
    if (!g) return;
    P11._giftId = id;
    $('p11-gift-game-name').textContent = g.title;
    $('p11-gift-game-cover').style.background = g.bg;
    $('p11-gift-game-price').textContent = fmtC(g.prices[P11.REGION]);
    $('p11-gift-friend').value = '';
    $('p11-gift-msg').value = '';
    $('p11-gift-overlay').classList.add('open');
    setTimeout(() => $('p11-gift-friend').focus(), 100);
  };
  P11.giftSend = function(){
    const friend = $('p11-gift-friend').value.trim();
    if (!friend){ toast('Введи ник друга', 'error'); $('p11-gift-friend').focus(); return; }
    const id = P11._giftId;
    const g = P11.GAMES.find(g => g.id === id);
    if (!g) return;
    const price = g.prices[P11.REGION];
    if (P11.getBal() < price){ toast('Недостаточно средств для подарка', 'error'); return; }
    if (typeof window.updBalance === 'function') window.updBalance(-price);
    toast(`🎁 ${g.title} → ${friend} · подарок отправлен!`, 'success');
    P11.giftClose();
  };
  P11.giftClose = function(){ $('p11-gift-overlay').classList.remove('open'); };

  // ─── Play (fake launch + hours tracker) ───
  P11.play = function(id){
    const data = P11.owned[id];
    if (!data) return;
    const g = P11.GAMES.find(g => g.id === id);
    if (!g) return;
    if (data.playing){
      if (data.tick) clearInterval(data.tick);
      delete data.playing;
      delete data.tick;
      P11.save();
      toast(`⏸ ${g.title} остановлено`, 'info');
      if (P11.SUBTAB === 'library') P11.renderLibrary();
    } else {
      toast(`🚀 Запуск ${g.title} через Steam...`, 'info');
      setTimeout(() => {
        toast(`▶ В игре: ${g.title}`, 'success');
        data.playing = true;
        data.lastPlayed = Date.now();
        // 1 real second = 1 game minute (for demo visibility)
        data.tick = setInterval(() => {
          data.minutes = (data.minutes || 0) + 1;
          if (P11.SUBTAB === 'library') P11.renderLibrary();
          if (data.minutes % 30 === 0) P11.save();
        }, 1000);
        if (P11.SUBTAB === 'library') P11.renderLibrary();
      }, 900);
    }
  };

  // ─── Periodic price-drop notifications for Wishlist items ───
  P11.startPriceDropTimer = function(){
    if (P11._dropTimer) return;
    P11._dropTimer = setInterval(() => {
      if (P11.wishlist.size === 0) return;
      const wlist = [...P11.wishlist];
      const pick = wlist[Math.floor(Math.random() * wlist.length)];
      const g = P11.GAMES.find(g => g.id === pick);
      if (!g) return;
      const cur = g.prices[P11.REGION];
      const orig = g.oldPrices[P11.REGION];
      // Don't go below 25% of original
      if (cur <= orig * 0.25) return;
      const drop = 5 + Math.floor(Math.random() * 15); // 5–20%
      g.prices[P11.REGION] = Math.max(Math.floor(cur * (1 - drop / 100)), Math.floor(orig * 0.25));
      toast(`📉 ${g.title}: цена упала на ${drop}%! Теперь ${fmtC(g.prices[P11.REGION])}`, 'success');
      if (P11.SUBTAB === 'wishlist') P11.renderWishlist();
      if (P11.SUBTAB === 'store') P11.renderStore();
    }, 45000); // 45s
  };

  // ════════════ Mount ════════════
  P11.replaceShop = function(){
    const sec = $('sec-games');
    if (!sec || sec.dataset.p11) return;
    sec.dataset.p11 = '1';
    sec.innerHTML = `
      <div class="section-title"><h2>🕹️ МАГАЗИН ИГР</h2><p>STEAM КЛЮЧИ · 15 ИГР · МГНОВЕННАЯ ДОСТАВКА</p></div>
      <div class="p11-subtabs">
        <div class="p11-subtab active" data-tab="store" onclick="P11.setSubTab('store')">🛒 МАГАЗИН</div>
        <div class="p11-subtab" data-tab="library" onclick="P11.setSubTab('library')">📚 БИБЛИОТЕКА</div>
        <div class="p11-subtab" data-tab="wishlist" onclick="P11.setSubTab('wishlist')">❤️ WISHLIST</div>
        <div class="p11-region-row">Регион:
          <span class="p11-region-flag ${P11.REGION === 'ru' ? 'active' : ''}" data-region="ru" onclick="P11.setRegion('ru')">🇷🇺 RU</span>
          <span class="p11-region-flag ${P11.REGION === 'eu' ? 'active' : ''}" data-region="eu" onclick="P11.setRegion('eu')">🇪🇺 EU</span>
          <span class="p11-region-flag ${P11.REGION === 'ww' ? 'active' : ''}" data-region="ww" onclick="P11.setRegion('ww')">🌍 WW</span>
        </div>
      </div>
      <div class="games-section-wrap">
        <div class="games-filter">
          <button class="gf-btn sel" onclick="P11.setFilter('all',this)">🎮 ВСЕ</button>
          <button class="gf-btn" onclick="P11.setFilter('action',this)">⚔️ ACTION</button>
          <button class="gf-btn" onclick="P11.setFilter('open-world',this)">🌍 ОТКРЫТЫЙ МИР</button>
          <button class="gf-btn" onclick="P11.setFilter('shooter',this)">🔫 ШУТЕР</button>
          <button class="gf-btn" onclick="P11.setFilter('rpg',this)">🧙 RPG</button>
          <button class="gf-btn" onclick="P11.setFilter('survival',this)">🪓 ВЫЖИВАНИЕ</button>
        </div>
        <div class="games-grid" id="games-grid"></div>
      </div>
    `;
    if (!$('p11-tr-overlay')){
      document.body.insertAdjacentHTML('beforeend', `
        <div class="p11-trailer-overlay" id="p11-tr-overlay">
          <div class="p11-trailer-box">
            <div class="p11-trailer-header">
              <div class="p11-trailer-title" id="p11-tr-title">Трейлер</div>
              <button class="p11-trailer-close" onclick="P11.trailerClose()" aria-label="Закрыть">×</button>
            </div>
            <div class="p11-trailer-video">
              <div class="p11-trailer-canvas" id="p11-tr-canvas"></div>
              <div class="p11-trailer-play-icon" id="p11-tr-play" onclick="P11.trailerToggle()"></div>
            </div>
            <div class="p11-trailer-controls">
              <div class="p11-trailer-progress" id="p11-tr-progress"><div class="p11-trailer-progress-bar" id="p11-tr-progress-bar"></div></div>
              <div class="p11-trailer-time" id="p11-tr-time">0:00 / 3:00</div>
              <button class="p11-trailer-fs" title="На YouTube" onclick="P11.trailerClose()">📺</button>
            </div>
          </div>
        </div>
        <div class="p11-gift-overlay" id="p11-gift-overlay">
          <div class="p11-gift-box">
            <div class="p11-gift-h">🎁 ПОДАРИТЬ ИГРУ</div>
            <div class="p11-gift-sub">Steam-key будет отправлен другу мгновенно</div>
            <div class="p11-gift-game-row">
              <div class="p11-gift-game-cover" id="p11-gift-game-cover"></div>
              <div class="p11-gift-game-name" id="p11-gift-game-name"></div>
              <div class="p11-gift-game-price" id="p11-gift-game-price"></div>
            </div>
            <input class="p11-gift-input" id="p11-gift-friend" placeholder="Ник друга (Steam / HVH.CASES)" maxlength="32">
            <textarea class="p11-gift-input p11-gift-msg-input" id="p11-gift-msg" placeholder="Сообщение (опционально)" maxlength="200"></textarea>
            <div class="p11-gift-btn-row">
              <button class="p11-gift-btn-cancel" onclick="P11.giftClose()">Отмена</button>
              <button class="p11-gift-btn-go" onclick="P11.giftSend()">🎁 ОТПРАВИТЬ ПОДАРОК</button>
            </div>
          </div>
        </div>
      `);
    }
    P11.renderStore();
    P11.startPriceDropTimer();
  };

  // Initial mount + showTab patch
  const tryInit = () => {
    if (!$('sec-games')){ setTimeout(tryInit, 200); return; }
    P11.replaceShop();
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', tryInit);
  else tryInit();

  // Re-render on tab switch (in case games-grid was cleared)
  const origShow = window.showTab;
  if (typeof origShow === 'function'){
    window.showTab = function(name, el){
      origShow.apply(this, arguments);
      if (name === 'games'){
        setTimeout(() => {
          P11.replaceShop();
          if (P11.SUBTAB === 'store') P11.renderStore();
          else if (P11.SUBTAB === 'library') P11.renderLibrary();
          else if (P11.SUBTAB === 'wishlist') P11.renderWishlist();
        }, 50);
      }
    };
  }
})();
</script>
